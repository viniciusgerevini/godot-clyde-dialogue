name: Godot tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GODO_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: godot --headless --import -gexit
    - name: Tests
      run: godot --headless -s --path "$PWD" addons/gut/gut_cmdln.gd -gexit

      
